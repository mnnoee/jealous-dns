[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jealous-dns"
description = "DNS record parser/formatter: tidy hosting/panel dumps into aligned text (CLI + Qt GUI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "mnnoee", email = "me@mnnoee.ru" }]
keywords = ["dns", "records", "formatter", "gui", "pyqt"]
dynamic = ["version"]

dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15; python_version < '3.12'", "PyQt6>=6.4"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/mnnoee/jealous-dns"
Source = "https://github.com/mnnoee/jealous-dns"

[project.scripts]
jealous-dns = "dnsparse.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dnsparse.constants.VERSION" }

[tool.setuptools.packages.find]
include = ["dnsparse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402"]